<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار التربية الفنية الشامل</title>
<style>
  :root {
    --primary-color: #2c3e50;
    --secondary-color: #3498db;
    --bg-color: #f8f9fa;
    --hover-bg: #e2e6ea;
  }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: var(--bg-color);
    color: #333;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .quiz-container {
    background: #fff;
    width: 90%;
    max-width: 800px;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 8px 16px rgba(0,0,0,0.1);
  }
  .quiz-header {
    border-bottom: 2px solid var(--secondary-color);
    padding-bottom: 15px;
    margin-bottom: 25px;
  }
  .quiz-header h2 {
    margin: 0;
    color: var(--primary-color);
  }
  .progress {
    margin-top: 10px;
    color: #7f8c8d;
    font-size: 1em;
    font-weight: bold;
  }
  .question {
    font-size: 1.3em;
    margin-bottom: 25px;
    line-height: 1.5;
    color: var(--primary-color);
  }
  .options-container {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .option-btn {
    background: #fdfdfd;
    border: 2px solid #dcdcdc;
    padding: 15px 20px;
    border-radius: 8px;
    cursor: pointer;
    text-align: right;
    font-size: 1.1em;
    font-family: inherit;
    transition: all 0.2s ease;
  }
  .option-btn:hover:not(:disabled) {
    background: var(--hover-bg);
    border-color: var(--secondary-color);
  }
  .option-btn:disabled {
    cursor: not-allowed;
  }
  /* تنسيق الإجابة الصحيحة */
  .option-btn.correct {
    background-color: #d4edda !important;
    border-color: #28a745 !important;
    color: #155724;
    font-weight: bold;
  }
  /* تنسيق الإجابة الخاطئة */
  .option-btn.wrong {
    background-color: #f8d7da !important;
    border-color: #dc3545 !important;
    color: #721c24;
  }
  #result-container {
    display: none;
    text-align: center;
    padding: 40px 0;
  }
  .result-score {
    font-size: 2.5em;
    font-weight: bold;
    color: var(--secondary-color);
  }
</style>
</head>
<body>

<div class="quiz-container">
  <div id="quiz-block">
    <div class="quiz-header">
      <h2>اختبار التربية الفنية (أشغال المعادن، الخشب، والطباعة)</h2>
      <div class="progress" id="progress-text"></div>
    </div>
    <div class="question" id="question-text"></div>
    <div class="options-container" id="options-container"></div>
  </div>

  <div id="result-container">
    <h2>انتهى الاختبار!</h2>
    <p>لقد أتممت الإجابة على جميع الأسئلة.</p>
    <div class="result-score" id="result-score"></div>
  </div>
</div>

<script>
const quizData = [
  { q: "يطلق الفرنسيون على معدن الآيتان اسم 'أيتونا' وتعني:", options: ["الفضة اللامعة.", "القصدير أو مشتقاته.", "المعدن الصلب.", "الخليط الثمين."], answer: 1 },
  { q: "من الدول التي أخذت الامتياز في تصنيع الآيتان:", options: ["الصين.", "فرنسا.", "ماليزيا.", "البرازيل."], answer: 1 },
  { q: "يستخدم الآيتان في أجهزة القياس بالغة الدقة مثل:", options: ["الموازين الإلكترونية.", "مقاييس الحرارة والضغط.", "الساعات الجدارية.", "البوصلة."], answer: 1 },
  { q: "من النماذج التي يمكن تلبيسها كلياً بالآيتان:", options: ["البراويز القديمة والأواني الخاصة بزينة المنزل.", "الأرضيات الخشبية.", "الملابس القطنية.", "الأثاث الضخم."], answer: 0 },
  { q: "'التلبيس الجزئي' يتم تنفيذه عن طريق:", options: ["تغطية العمل بالكامل.", "تنفيذ الزخرفة على سطح الآيتان ثم لصقها على أجزاء من نماذج مختلفة.", "صهر المعدن وصبه في قوالب.", "تلوين أجزاء من المعدن."], answer: 1 },
  { q: "يمكن تنفيذ التلبيس الجزئي على أسطح نماذج مثل:", options: ["الخشب أو البلاستيك أو الزجاج.", "الأقمشة والورق فقط.", "المعادن الثقيلة فقط.", "الأحجار الكريمة."], answer: 0 },
  { q: "لإعطاء ملامس لسطح الآيتان، يمكن استخدام:", options: ["أقلام التحديد بالحز والحفر والضغط.", "فرشاة الرسم العادية.", "الصباغة اليدوية.", "الورق الملون."], answer: 0 },
  { q: "أسلوب 'التطعيم' في فن الآيتان يعني إضافة:", options: ["ألوان الأكريليك.", "الأحجار الكريمة أو الخرز الملون أو الإكسسوار.", "طبقة من الورنيش.", "خيوط قطنية."], answer: 1 },
  { q: "يستخدم أسلوب 'العتيق' لإعطاء المشغولات المعدنية إيحاءً بأنها:", options: ["حديثة جداً ولامعة.", "قطعة قديمة ذات قيمة جمالية وتجسيم وظل.", "مصنوعة من البلاستيك.", "خفيفة الوزن."], answer: 1 },
  { q: "الفرق الرئيسي بين القصدير والآيتان هو أن القصدير:", options: ["خليط من الفلزات.", "عنصر كيميائي يتواجد في الطبيعة في حالة صلبة.", "أغلى ثمناً من الآيتان.", "يصعب ثنيه يدوياً."], answer: 1 },
  { q: "من مميزات القصدير مقارنة بالآيتان أنه:", options: ["سهل التمزق في الأعمال الفنية.", "مقاوم للتآكل والصدأ.", "لا يتوفر دائماً في الأسواق.", "يحتاج لدرجات حرارة عالية جداً للصهر."], answer: 1 },
  { q: "يستخدم النحاس قديماً وحديثاً في صناعة:", options: ["الحلي.", "الورق.", "الأقمشة.", "الزجاج."], answer: 0 },
  { q: "الآيتان معدن رقيق قليل الصلابة، لذا فهو:", options: ["غير قابل لإعادة التصنيع.", "طيع وقابل لإعادة التصنيع.", "ينكسر بسهولة عند الضغط.", "يستخدم في بناء الهياكل فقط."], answer: 1 },
  { q: "يوجد الآيتان بكثرة في:", options: ["فرنسا وبلجيكا وألمانيا.", "الهند والصين فقط.", "مصر والسودان.", "أمريكا والبرازيل."], answer: 0 },
  { q: "يتكون الخشب من خلايا وألياف دقيقة تتخللها:", options: ["حبيبات رملية.", "فراغات هوائية.", "سوائل معدنية.", "خيوط حريرية."], answer: 1 },
  { q: "يتميز الخشب 'الصلد' (الصلب) بـ:", options: ["انخفاض أسعاره في الأسواق.", "أوراقه الإبرية التي لا تسقط.", "ثرائه بالألوان والخطوط والتعاريج ومتانته.", "سهولة نشره وثقبه يدوياً."], answer: 2 },
  { q: "من أمثلة الأشجار التي يستخرج منها الخشب الصلد:", options: ["الصنوبر والأرز.", "الزان والبلوط والجوز والقسطل.", "الراتنجي والبتولا.", "النخيل فقط."], answer: 1 },
  { q: "يتميز الخشب 'اللين' بأن أوراقه تكون غالباً:", options: ["مفلطحة وعريضة.", "إبرية وتحتفظ بخضرتها طوال العام.", "صفراء اللون دائماً.", "تتساقط في فصل الربيع."], answer: 1 },
  { q: "من أنواع الخشب اللين:", options: ["الأبنوس والزان.", "الصنوبر والأرز والراتنجي.", "المهوجني والبلوط.", "الجوز والورد."], answer: 1 },
  { q: "'الحفر الغائر' هو إزالة جزيئات الخشب من:", options: ["المساحات المحيطة بالرسمة.", "العنصر المراد إغارته إلى عمق محدد.", "خلف القطعة الخشبية.", "الأطراف الخارجية فقط."], answer: 1 },
  { q: "تستخدم وصلات 'الشق والأخدود' بكثرة في تصنيع:", options: ["إطارات النوافذ.", "الأدراج بكل أشكالها وأحجامها.", "أرجل الطاولات الثقيلة.", "بناء السفن الكبيرة."], answer: 1 },
  { q: "وصلة 'التلسين العمودي' أكثر صلابة ومتانة وتستخدم غالباً في:", options: ["تثبيت أرجل الأثاث بوجه عام.", "صنع الصناديق الورقية.", "تعليق اللوحات.", "زخرفة الأبواب فقط."], answer: 0 },
  { q: "تستعمل وصلة (T) بواسطة المسامير بكثرة في:", options: ["صناعة الأثاث الفاخر.", "إطارات النوافذ والأبواب.", "تثبيت الأرفف الزجاجية.", "القوارب الخشبية."], answer: 1 },
  { q: "تستخدم الوصلة بواسطة 'مثبتات معدنية' في الأماكن التي:", options: ["يكون فيها مظهر الوصلة مهماً جداً.", "لا يكون فيها مظهر الوصلة مهماً أو تحتاج لإظهار وجه واحد.", "تتعرض للماء بشكل دائم.", "تكون مصنوعة من خشب الصنوبر فقط."], answer: 1 },
  { q: "تعتبر وصلة (T) 'المدموجة' من أكثر الطرق انتشاراً لقدرتها على:", options: ["تحمل القوى المختلفة لأنها موجودة داخل الأضلاع الخشبية.", "فكها وتركيبها بسهولة.", "التمدد والانكماش مع الحرارة.", "إعطاء شكل جمالي بارز."], answer: 0 },
  { q: "من أدوات الحفر على الخشب:", options: ["الفرشاة والألوان.", "المنشار والمطرقة والمبرد والإزميل.", "المقص واللاصق.", "الخيوط والإبر."], answer: 1 },
  { q: "اشتهرت طباعة 'العقد والربط' قديماً عند شعوب:", options: ["شمال أوروبا.", "جنوب شرق آسيا (أندونيسيا).", "غرب أفريقيا.", "أمريكا الجنوبية."], answer: 1 },
  { q: "من أساليب الطباعة بالعقد المختلفة:", options: ["الطي، والتكسير بالمشابك، والربط بالعقد، والربط بالسراجة.", "الطباعة الآلية فقط.", "الحفر على الخشب.", "التلبيس المعدني."], answer: 0 },
  { q: "في 'الربط بالعقد'، يتم عقد القماش مشدوداً من نفس القماش:", options: ["باستخدام خيوط سميكة جداً.", "دون استخدام الخيط.", "باستخدام غراء قوي.", "بواسطة مشابك الغسيل."], answer: 1 },
  { q: "تعتمد طريقة 'الربط بعقد الأشكال' على وضع أجسام صلبة داخل القماش مثل:", options: ["الورق المقوى.", "الكرات الصغيرة أو النقود المعدنية أو الحصى.", "قطع الإسفنج.", "البلاستيك السائل."], answer: 1 },
  { q: "من أنواع السراجة المستخدمة في الطباعة:", options: ["السراجة الجارية والمتصلة وسراجة اللف.", "السراجة الآلية فقط.", "سراجة الزجزاج.", "سراجة الحشو."], answer: 0 },
  { q: "يستخرج اللون 'الأصفر' من مصدر حيواني من:", options: ["دم الحيوانات.", "مرارة الحيوانات.", "جلود الحيوانات.", "صوف الغنم."], answer: 1 },
  { q: "تعتبر 'دودة القرمز' مصدراً لصبغة تعطي ألواناً مختلفة باختلاف:", options: ["درجة الحرارة.", "نوع المثبت المستعمل.", "نوع القماش.", "كمية الماء."], answer: 1 },
  { q: "استخدم المصريون القدماء الصبغات المعدنية، ووجد أكسيد النحاس للحصول على صبغة:", options: ["زرقاء.", "خضراء.", "حمراء.", "صفراء."], answer: 0 },
  { q: "للحصول على صبغة 'زرقاء' من مصدر معدني، يستخدم معدن:", options: ["الحديد.", "اللازورد.", "الذهب.", "الزنك."], answer: 1 },
  { q: "يجب غسل بعض الأقمشة قبل تطبيق الطباعة عليها لأنها تحتوي على:", options: ["ألوان زائدة.", "مواد نشوية تمنع تغلغل الصبغة.", "أتربة كثيفة.", "روائح غير مرغوبة."], answer: 1 },
  { q: "من خصائص المنسوجات المناسبة لطباعة العقد أن تكون ألوانها:", options: ["غامقة جداً.", "فاتحة (للتأكيد على خاصية الشفافية).", "سوداء فقط.", "غير قابلة للتشرب."], answer: 1 },
  { q: "أفضل المنسوجات التي يمكن تطبيق طباعة العقد عليها هي:", options: ["الألياف الصناعية كالبوليستر.", "القطن والكتان والحرير والصوف.", "الجلود الطبيعية فقط.", "البلاستيك المقوى."], answer: 1 },
  { q: "في الجزيرة العربية، ظهرت حرفة الصباغة في مكة والمدينة وكان لها سوق يسمى:", options: ["سوق القماش.", "سوق صباغي الحرير.", "سوق صباغي مكة (سوق الصباغين).", "سوق العطارين."], answer: 2 },
  { q: "استخدمت النساء في مكة ومنطقة الهدا بالطائف نبات النيلة للحصول على اللون:", options: ["الأحمر.", "الأزرق.", "الأصفر.", "البرتقالي."], answer: 1 },
  { q: "تعتبر الصبغات 'الحديثة' مفضلة حالياً بسبب:", options: ["سهولة الحصول عليها وثبات ألوانها وتعدد درجاتها.", "أنها طبيعية 100%.", "رائحتها الجميلة.", "تكلفتها العالية جداً."], answer: 0 },
  { q: "الآيتان هو خليط من مجموعة من الفلزات هي الفضة والقصدير والرصاص والزئبق.", options: ["صح", "خطأ"], answer: 0 },
  { q: "يتميز معدن الآيتان بأنه سهل الانصهار والانطواء والتمدد.", options: ["صح", "خطأ"], answer: 0 },
  { q: "يوجد معدن الآيتان بكثرة في دول مثل فرنسا وبلجيكا وألمانيا.", options: ["صح", "خطأ"], answer: 0 },
  { q: "التلبيس الكلي هو عبارة عن تغطية النموذج المختار تغطية كاملة بخامة الآيتان.", options: ["صح", "خطأ"], answer: 0 },
  { q: "يعتبر الآيتان معدناً شديد الصلابة وغير قابل لإعادة التصنيع.", options: ["صح", "خطأ"], answer: 1 },
  { q: "يتكون الخشب من خلايا وألياف دقيقة تتخللها فراغات هوائية.", options: ["صح", "خطأ"], answer: 0 },
  { q: "المادتان الرئيستان اللتان تتركب منهما ألياف الخشب هما السليلوز والخشبيين (اللجنين).", options: ["صح", "خطأ"], answer: 0 },
  { q: "تتميز أشجار الخشب الصلد بأوراقها الإبرية التي لا تسقط طوال العام.", options: ["صح", "خطأ"], answer: 1 },
  { q: "يعتبر خشب الصنوبر والأرز والراتنجي من أنواع الخشب اللين.", options: ["صح", "خطأ"], answer: 0 },
  { q: "الحفر البارز هو إزالة جزيئات الخشب التي تحيط بالعنصر المراد إبرازه بارتفاع محدد.", options: ["صح", "خطأ"], answer: 0 },
  { q: "تستخدم المثبتات المعدنية في الأماكن التي يكون فيها مظهر الوصلة مهماً جداً.", options: ["صح", "خطأ"], answer: 1 },
  { q: "تعتبر وصلة (T) المدموجة أكثر الطرق انتشاراً لقدرتها العالية على تحمل القوى المختلفة.", options: ["صح", "خطأ"], answer: 0 },
  { q: "اشتهر فن طباعة العقد والربط قديماً عند شعوب جنوب شرق آسيا (أندونيسيا).", options: ["صح", "خطأ"], answer: 0 },
  { q: "يتم الحصول على اللون الأزرق من المصادر النباتية عن طريق نبات الزعفران.", options: ["صح", "خطأ"], answer: 1 },
  { q: "تعطي دودة القرمز صبغة ذات ألوان مختلفة باختلاف نوع المثبت المستعمل.", options: ["صح", "خطأ"], answer: 0 },
  { q: "يفضل استخدام الصبغات الحديثة حالياً لصعوبة الحصول عليها وتكلفتها العالية.", options: ["صح", "خطأ"], answer: 1 },
  { q: "يجب غسل بعض الأقمشة قبل الطباعة عليها لإزالة المواد النشوية التي تمنع تغلغل الصبغة.", options: ["صح", "خطأ"], answer: 0 },
  { q: "يعتبر الشمع من أفضل المواد العازلة في الطباعة لجودته في العزل ووفرته وثمنه الزهيد.", options: ["صح", "خطأ"], answer: 0 },
  { q: "القصدير عنصر كيميائي يتواجد في الطبيعة في حالة صلبة، بينما الآيتان خليط من الفلزات.", options: ["صح", "خطأ"], answer: 0 }
];

let currentQuestionIndex = 0;
let score = 0;

const questionEl = document.getElementById("question-text");
const optionsContainer = document.getElementById("options-container");
const progressText = document.getElementById("progress-text");
const quizBlock = document.getElementById("quiz-block");
const resultContainer = document.getElementById("result-container");
const resultScore = document.getElementById("result-score");

function loadQuestion() {
  const currentQ = quizData[currentQuestionIndex];
  questionEl.innerText = currentQ.q;
  optionsContainer.innerHTML = "";
  progressText.innerText = `السؤال ${currentQuestionIndex + 1} من ${quizData.length}`;

  currentQ.options.forEach((opt, index) => {
    const btn = document.createElement("button");
    btn.classList.add("option-btn");
    btn.innerText = opt;
    btn.onclick = () => handleAnswer(index, btn);
    optionsContainer.appendChild(btn);
  });
}

function handleAnswer(selectedIndex, clickedBtn) {
  // إيقاف تفعيل جميع الأزرار لمنع النقر المتعدد
  const allButtons = optionsContainer.querySelectorAll(".option-btn");
  allButtons.forEach(btn => btn.disabled = true);

  const currentQ = quizData[currentQuestionIndex];
  const correctIndex = currentQ.answer;

  // التحقق من الإجابة وتطبيق الفيد باك
  if (selectedIndex === correctIndex) {
    clickedBtn.classList.add("correct");
    score++;
  } else {
    clickedBtn.classList.add("wrong");
    // تظليل الإجابة الصحيحة باللون الأخضر لتصحيح المعلومة
    allButtons[correctIndex].classList.add("correct");
  }
  
  // الانتظار لمدة 1.5 ثانية (1500 ملي ثانية) ثم الانتقال للسؤال التالي
  setTimeout(() => {
    currentQuestionIndex++;
    if (currentQuestionIndex < quizData.length) {
      loadQuestion();
    } else {
      showResults();
    }
  }, 1500);
}

function showResults() {
  quizBlock.style.display = "none";
  resultContainer.style.display = "block";
  resultScore.innerText = `${score} / ${quizData.length}`;
}

// تهيئة الاختبار عند تحميل الصفحة
loadQuestion();
</script>

</body>
</html>
