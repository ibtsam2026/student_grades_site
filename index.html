<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار التربية الفنية التفاعلي الشامل</title>
<style>
  :root {
    --primary-color: #4a3b32; /* بني داكن */
    --secondary-color: #b07d54; /* لون خشبي متوسط */
    --bg-color: #f6eadd; /* لون خشبي فاتح جداً */
    --hover-bg: #ebd6c5; 
    --success-color: #28a745;
    --danger-color: #dc3545;
  }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: var(--bg-color);
    background-image: radial-gradient(#e5d0bc 1px, transparent 1px);
    background-size: 20px 20px;
    color: #333;
    margin: 0;
    padding: 20px 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .quiz-container {
    background: #fff;
    width: 90%;
    max-width: 850px;
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(74, 59, 50, 0.15);
    border: 1px solid #e5d0bc;
  }
  .quiz-header {
    border-bottom: 2px solid var(--secondary-color);
    padding-bottom: 15px;
    margin-bottom: 25px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
  }
  .quiz-header h2 {
    margin: 0;
    color: var(--primary-color);
    width: 100%;
    margin-bottom: 15px;
  }
  .stats {
    display: flex;
    justify-content: space-between;
    width: 100%;
    font-size: 1.1em;
    font-weight: bold;
    color: #8c6b54;
  }
  .score-badge {
    background-color: var(--primary-color);
    color: #fff;
    padding: 5px 15px;
    border-radius: 20px;
    font-size: 0.95em;
  }
  .question {
    font-size: 1.3em;
    margin-bottom: 20px;
    line-height: 1.6;
    color: var(--primary-color);
    font-weight: bold;
  }
  .options-container {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .option-btn {
    background: #fdfcfb;
    border: 2px solid #e5d0bc;
    padding: 15px 20px;
    border-radius: 8px;
    cursor: pointer;
    text-align: right;
    font-size: 1.1em;
    font-family: inherit;
    color: var(--primary-color);
    transition: all 0.2s ease;
  }
  .option-btn:hover:not(:disabled) {
    background: var(--hover-bg);
    border-color: var(--secondary-color);
  }
  .option-btn:disabled {
    cursor: not-allowed;
  }
  .option-btn.correct {
    background-color: #d4edda !important;
    border-color: var(--success-color) !important;
    color: #155724;
    font-weight: bold;
  }
  .option-btn.wrong {
    background-color: #f8d7da !important;
    border-color: var(--danger-color) !important;
    color: #721c24;
  }
  .explanation-box {
    display: none; 
    margin-top: 20px;
    padding: 15px;
    border-radius: 8px;
    background-color: #fdf8f4;
    border-right: 5px solid var(--secondary-color);
    color: var(--primary-color);
    font-size: 1.1em;
    line-height: 1.6;
    animation: fadeIn 0.5s;
  }
  .next-btn {
    display: none; 
    margin-top: 20px;
    padding: 12px 25px;
    background-color: var(--secondary-color);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 1.1em;
    cursor: pointer;
    float: left;
    transition: background 0.3s;
  }
  .next-btn:hover { background-color: #926442; }
  .clearfix::after { content: ""; clear: both; display: table; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  #result-container {
    display: none;
    text-align: center;
    padding: 40px 0;
  }
  .result-score {
    font-size: 3em;
    font-weight: bold;
    color: var(--secondary-color);
    margin-top: 15px;
  }
  .result-message {
    font-size: 1.3em;
    color: var(--primary-color);
    margin-top: 10px;
  }
</style>
</head>
<body>

<div class="quiz-container">
  <div id="quiz-block">
    <div class="quiz-header">
      <h2>اختبار التربية الفنية الشامل</h2>
      <div class="stats">
        <span id="progress-text">السؤال 1 من 60</span>
        <span class="score-badge" id="live-score">الدرجة: 0 / 60</span>
      </div>
    </div>
    <div class="question" id="question-text"></div>
    <div class="options-container" id="options-container"></div>
    
    <div id="explanation-box" class="explanation-box"></div>
    <div class="clearfix">
      <button id="next-btn" class="next-btn" onclick="nextQuestion()">السؤال التالي ❮</button>
    </div>
  </div>

  <div id="result-container">
    <h2>انتهى الاختبار!</h2>
    <p class="result-message">شكراً لمجهودك، إليك النتيجة النهائية:</p>
    <div class="result-score" id="result-score"></div>
  </div>
</div>

<script>
const quizData = [
  // --- الوحدة الأولى: أشغال المعادن (20 سؤال) ---
  { q: "معدن الآيتان هو أحد المعادن الجديدة في مجال التشكيل الفني التي استخدمت في الأغراض النفعية كالحلي والتحف.", options: ["صح", "خطأ"], answer: 0, rationale: "يستخدم الآيتان لمرونته وجماله في صنع أدوات الزينة والحلي." },
  { q: "يتكون معدن الآيتان من خليط من الفلزات هي:", options: ["الحديد والنحاس والذهب.", "الفضة والقصدير والرصاص والزئبق.", "الألمنيوم والزنك والنيكل.", "البرونز والقصدير والذهب."], answer: 1, rationale: "هذه هي المكونات الأساسية لسبيكة الآيتان الفنية." },
  { q: "يطلق الفرنسيون على معدن الآيتان اسم 'أيتونا' والتي تعني القصدير أو مشتقاته.", options: ["صح", "خطأ"], answer: 0, rationale: "لأن القصدير يمثل جزءاً أساسياً من مكونات السبيكة." },
  { q: "تعتبر الدولة التي حصلت على الامتياز في تصنيع الآيتان وجودته هي:", options: ["إيطاليا", "فرنسا", "الصين", "ماليزيا"], answer: 1, rationale: "فرنسا هي صاحبة الامتياز في تصنيعه." },
  { q: "يتميز الآيتان بأنه معدن سهل الانصهار والانطواء والتمدد مما يجعله طيعاً في العمل الفني.", options: ["صح", "خطأ"], answer: 0, rationale: "هذه الخصائص تجعله ممتازاً للتشكيل اليدوي." },
  { q: "من الناحية الفيزيائية، يعتبر الآيتان معدناً مضغوطاً لا يوجد به هواء.", options: ["صح", "خطأ"], answer: 0, rationale: "هذه إحدى أهم خصائصه الفيزيائية." },
  { q: "يستخدم الآيتان في أجهزة القياس الدقيقة مثل:", options: ["الموازين.", "أجهزة قياس السرعة.", "مقاييس الحرارة والضغط.", "البوصلة."], answer: 2, rationale: "لدقته وحساسيته العالية يستخدم في مقاييس الحرارة والضغط." },
  { q: "يعمل الآيتان كمادة عازلة للحماية من الأشعة، حيث يوضع داخل الجدران.", options: ["صح", "خطأ"], answer: 0, rationale: "يستخدم بكفاءة لهذا الغرض الصناعي الطبي." },
  { q: "الفرق بين الآيتان والقصدير هو أن القصدير عنصر كيميائي صلب، بينما الآيتان خليط فلزي.", options: ["صح", "خطأ"], answer: 0, rationale: "القصدير عنصر طبيعي، والآيتان سبيكة مصنعة." },
  { q: "يعتبر الآيتان أرخص ثمناً من القصدير.", options: ["صح", "خطأ"], answer: 1, rationale: "الآيتان أغلى بسبب احتوائه على خامة الفضة النفيسة." },
  { q: "التلبيس هو عملية تغطية النموذج المراد تزيينه بخامة الآيتان لإظهار تفاصيله.", options: ["صح", "خطأ"], answer: 0, rationale: "هذا هو التعريف الدقيق لعملية التلبيس." },
  { q: "ينقسم التلبيس إلى نوعين رئيسيين هما:", options: ["أمامي وخلفي.", "كلي وجزئي.", "داخلي وخارجي.", "معدني وخشبي."], answer: 1, rationale: "هذا هو التصنيف الفني الصحيح لعملية التلبيس." },
  { q: "التلبيس الكلي هو تغطية النموذج المختار تغطية كاملة بالآيتان مثل البراويز والعلب.", options: ["صح", "خطأ"], answer: 0, rationale: "يتم إخفاء السطح الأصلي بالكامل وتغليفه." },
  { q: "التلبيس الجزئي يعتمد على تنفيذ الزخرفة على الآيتان أولاً ثم لصقها على أجزاء من النموذج.", options: ["صح", "خطأ"], answer: 0, rationale: "حيث لا يغطى النموذج بالكامل بل تضاف القطع كزخرفة." },
  { q: "يمكن تنفيذ التلبيس الجزئي على أسطح متنوعة مثل الخشب والبلاستيك والزجاج والفخار.", options: ["صح", "خطأ"], answer: 0, rationale: "يمكن تنفيذه بنجاح على هذه الأسطح الصلبة المختلفة." },
  { q: "لإعطاء ملامس لسطح الآيتان، يمكن صقل المساحات حول العناصر الزخرفية لإبرازها.", options: ["صح", "خطأ"], answer: 0, rationale: "الصقل يبرز الشكل ويصنع تبايناً في الملمس." },
  { q: "تستخدم المدقات الخاصة بالجلد أو المعدن لعمل ملامس متنوعة على سطح الآيتان.", options: ["صح", "خطأ"], answer: 0, rationale: "المدقات تترك أثراً غائراً يصنع الملمس الجمالي." },
  { q: "يمكن تكوين ملامس باستخدام أقلام التحديد بالحز والحفر والضغط يدوياً.", options: ["صح", "خطأ"], answer: 0, rationale: "هذه من الطرق اليدوية الشائعة والبسيطة في التشكيل." },
  { q: "التطعيم في فن الآيتان يعني إضافة:", options: ["ألوان الأصباغ.", "أحجار كريمة أو خرز أو إكسسوارات.", "الخشب.", "الشمع."], answer: 1, rationale: "لإضفاء قيمة جمالية وتنوع لوني للمعدن." },
  { q: "يستخدم أسلوب التعتيق لإعطاء إيحاء بأن القطعة جديدة ولامعة جداً.", options: ["صح", "خطأ"], answer: 1, rationale: "التعتيق يستخدم لتبدو القطعة قديمة وأثرية." },

  // --- الوحدة الثانية: أشغال الخشب (20 سؤال) ---
  { q: "يتكون الخشب من خلايا وألياف دقيقة تتخللها فراغات هوائية.", options: ["صح", "خطأ"], answer: 0, rationale: "هذا هو التركيب البنائي للخشب الذي يجعله قابلاً للطفو." },
  { q: "تتركب ألياف الخشب من مادتين رئيستين هما:", options: ["الكربون والحديد.", "السليلوز والخشبيين (اللجنين).", "الراتنج والكلوروفيل.", "الصمغ والماء."], answer: 1, rationale: "هاتان المادتان هما أساس بناء الخلايا النباتية في الخشب." },
  { q: "يختلف الخشب في وزنه وصلابته ولونه تبعا لاختلاف تركيبه الخلوي.", options: ["صح", "خطأ"], answer: 0, rationale: "التركيب الداخلي هو ما يحدد الخصائص الفيزيائية الخارجية." },
  { q: "تنقسم الأخشاب إلى نوعين رئيسيين هما الخشب الصلد (الصلب) والخشب اللين.", options: ["صح", "خطأ"], answer: 0, rationale: "هذا هو التصنيف الأساسي والمعتمد للأخشاب." },
  { q: "يتميز الخشب الصلد بارتفاع أسعاره وبأنه ثري بالألوان والخطوط والتعاريج.", options: ["صح", "خطأ"], answer: 0, rationale: "كثافته ومتانته وجمال تعاريجه تجعله باهظ الثمن." },
  { q: "أشجار الخشب الصلد لها أوراق مفلطحة وعريضة تسقط في فصل الخريف.", options: ["صح", "خطأ"], answer: 0, rationale: "هذه من الخصائص النباتية لأشجار الأخشاب الصلبة." },
  { q: "من أمثلة الخشب الصلد (الصلب):", options: ["الصنوبر والأرز.", "القسطل (أبو فروة) والبلوط والزان والجوز.", "الراتنجي.", "النخيل."], answer: 1, rationale: "هذه من أشهر وأمتن أنواع الأخشاب الصلبة." },
  { q: "يتميز الخشب اللين بانخفاض أسعاره وسهولة النشر والثقب والتشغيل.", options: ["صح", "خطأ"], answer: 0, rationale: "لذلك يستخدم بكثرة في أعمال الديكور والبناء السريعة." },
  { q: "أوراق أشجار الخشب اللين غالباً ما تكون إبرية صغيرة وتحتفظ بخضرتها طوال العام.", options: ["صح", "خطأ"], answer: 0, rationale: "مثل شجرة الصنوبر ذات الأوراق الإبرية." },
  { q: "من أمثلة الخشب اللين شجر الصنوبر والأرز والراتنجي.", options: ["صح", "خطأ"], answer: 0, rationale: "تعتبر هذه الأشجار من أهم مصادر الخشب اللين." },
  { q: "يستخدم الخشب الصلب بكثرة في صناعة الأبواب والنوافذ والأرضيات والأثاث المتين.", options: ["صح", "خطأ"], answer: 0, rationale: "بسبب قدرته العالية على تحمل الضغط والاستخدام المستمر." },
  { q: "يستخدم الخشب اللين في مجالات الديكور العام والحواجز والسلالم الخشبية.", options: ["صح", "خطأ"], answer: 0, rationale: "لخفة وزنه وسهولة تشكيله." },
  { q: "تقنية الحفر البارز تعني إزالة جزيئات الخشب المحيطة بالعنصر لإبرازه بارتفاع محدد.", options: ["صح", "خطأ"], answer: 0, rationale: "بخفض مستوى الخلفية يبرز التصميم الأساسي للأمام." },
  { q: "تقنية الحفر الغائر تعني إزالة جزيئات الخشب من داخل العنصر نفسه لإغارته للداخل.", options: ["صح", "خطأ"], answer: 0, rationale: "حيث يتم حفر التصميم ليكون أعمق من السطح المحيط به." },
  { q: "استخدم الإنسان قديماً الوصلات والتعاشيق الخشبية لتثبيت الخشب قبل اختراع الصمغ والمسامير الحديثة.", options: ["صح", "خطأ"], answer: 0, rationale: "استخدمت كحل هندسي متين قبل التقنيات الحديثة للتثبيت." },
  { q: "تستخدم وصلة (T) بواسطة المسامير بكثرة في:", options: ["صناعة السفن.", "الأثاث الفاخر.", "إطارات النوافذ والأبواب.", "الأرضيات الخشبية."], answer: 2, rationale: "حيث توفر تثبيتاً سريعاً وعملياً في الزوايا العمودية." },
  { q: "تستخدم الوصلة بواسطة مثبتات معدنية عندما لا يكون مظهر الوصلة مهماً أو لإظهار وجه واحد.", options: ["صح", "خطأ"], answer: 0, rationale: "تستخدم في الأماكن المخفية لعدم جمالية المظهر المعدني الخارجي." },
  { q: "وصلة (T) المدموجة هي الأكثر انتشاراً وقدرة على تحمل القوى لأنها داخل الأضلاع الخشبية.", options: ["صح", "خطأ"], answer: 0, rationale: "وجودها داخل الخشب يوزع الضغط ويعطيها متانة عالية." },
  { q: "تتميز وصلات التلسين العمودي بصلابتها الكبيرة وتستخدم لتثبيت أرجل المقاعد.", options: ["صح", "خطأ"], answer: 0, rationale: "تتحمل أوزاناً كبيرة لذلك تناسب الكراسي والمقاعد." },
  { q: "وصلات الشق والأخدود هي وصلات بسيطة تستخدم بكثرة في تصنيع الأدراج.", options: ["صح", "خطأ"], answer: 0, rationale: "تعطي ثباتاً ممتازاً لزوايا الأدراج الخشبية." },

  // --- الوحدة الثالثة: فن الطباعة والصباغة (20 سؤال) ---
  { q: "طباعة العقد والربط هي طريقة قديمة استخدمت لتلوين الأقمشة وزخرفتها.", options: ["صح", "خطأ"], answer: 0, rationale: "هي تقنية تراثية معروفة منذ القدم." },
  { q: "اشتهر فن العقد والربط قديماً عند شعوب:", options: ["شمال أوروبا.", "جنوب شرق آسيا (أندونيسيا).", "غرب أفريقيا.", "أمريكا."], answer: 1, rationale: "حيث ازدهرت فنون الباتيك والتاي داي في هذه المناطق." },
  { q: "تعتمد طريقة العقد والربط على عزل أجزاء من القماش عن الصبغة باستخدام الخيوط أو الحبال المشمعة.", options: ["صح", "خطأ"], answer: 0, rationale: "الشد بالخيط يمنع وصول الصبغة لتلك الأجزاء المعزولة." },
  { q: "عملية الربط هي المرحلة التي يتم فيها تحديد خطوط التصميم وعزلها بواسطة الخيط أو المطاط.", options: ["صح", "خطأ"], answer: 0, rationale: "مواقع الربط هي التي ستشكل الزخرفة بعد فكها." },
  { q: "يؤثر سمك الخيط وعدد الربطات وحجمها بشكل مباشر على شكل التصميم النهائي.", options: ["صح", "خطأ"], answer: 0, rationale: "سمك الخيط وعدد الربطات يغير من عرض الخطوط وشكل الزخرفة." },
  { q: "من أساليب الطباعة بالعقد:", options: ["الحفر الغائر والبارز.", "التلبيس الكلي.", "الطي، التكسير، الربط بعقد الأشكال، والربط بالسراجة.", "الصقل والسنفرة."], answer: 2, rationale: "هذه هي التقنيات الأساسية لتجعيد القماش وربطه." },
  { q: "الطي هو عملية ثني القماش وتطبيقه بانتظام، والطي الرأسي ينتج تأثيرات أفقية.", options: ["صح", "خطأ"], answer: 0, rationale: "بسبب اتجاه تغلغل الصبغة العكسي عبر الطيات." },
  { q: "تنقسم أنواع الطيات إلى الأساسية، والمركزية، والمركزية المتصلة من النصف.", options: ["صح", "خطأ"], answer: 0, rationale: "هذه هي التقسيمات الهندسية للطي في فن الطباعة." },
  { q: "في الربط بالعقد، يتم عقد القماش من نفسه دون استخدام خيوط خارجية.", options: ["صح", "خطأ"], answer: 0, rationale: "يتم استخدام نفس النسيج لعمل العقدة العازلة." },
  { q: "الربط بعقد الأشكال يعتمد على وضع أجسام صلبة كالحصى أو النقود داخل القماش قبل ربطه.", options: ["صح", "خطأ"], answer: 0, rationale: "لإعطاء دوائر وأشكال دقيقة بعد إتمام الصباغة." },

let currentQuestionIndex = 0;
let score = 0;
const totalQuestions = quizData.length;

const questionEl = document.getElementById("question-text");
const optionsContainer = document.getElementById("options-container");
const progressText = document.getElementById("progress-text");
const liveScoreText = document.getElementById("live-score");
const quizBlock = document.getElementById("quiz-block");
const resultContainer = document.getElementById("result-container");
const resultScore = document.getElementById("result-score");
const explanationBox = document.getElementById("explanation-box");
const nextBtn = document.getElementById("next-btn");

function updateScoreUI() {
  liveScoreText.innerText = `الدرجة: ${score} / ${totalQuestions}`;
}

function loadQuestion() {
  explanationBox.style.display = "none";
  nextBtn.style.display = "none";
  optionsContainer.innerHTML = "";
  
  const currentQ = quizData[currentQuestionIndex];
  questionEl.innerText = currentQ.q;
  progressText.innerText = `السؤال ${currentQuestionIndex + 1} من ${totalQuestions}`;

  currentQ.options.forEach((opt, index) => {
    const btn = document.createElement("button");
    btn.classList.add("option-btn");
    btn.innerText = opt;
    btn.onclick = () => handleAnswer(index, btn);
    optionsContainer.appendChild(btn);
  });
}

function handleAnswer(selectedIndex, clickedBtn) {
  const allButtons = optionsContainer.querySelectorAll(".option-btn");
  allButtons.forEach(btn => btn.disabled = true);

  const currentQ = quizData[currentQuestionIndex];
  const correctIndex = currentQ.answer;

  if (selectedIndex === correctIndex) {
    clickedBtn.classList.add("correct");
    score++;
    updateScoreUI(); 
  } else {
    clickedBtn.classList.add("wrong");
    allButtons[correctIndex].classList.add("correct");
  }
  
  explanationBox.innerHTML = `<strong>توضيح:</strong> ${currentQ.rationale}`;
  explanationBox.style.display = "block";
  nextBtn.style.display = "block";
}

function nextQuestion() {
  currentQuestionIndex++;
  if (currentQuestionIndex < totalQuestions) {
    loadQuestion();
  } else {
    showResults();
  }
}

function showResults() {
  quizBlock.style.display = "none";
  resultContainer.style.display = "block";
  resultScore.innerText = `${score} / ${totalQuestions}`;
}

loadQuestion();
</script>
